name: Comprehensive Verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  typecheck-and-ai-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      # Type-check without emitting files; the build job below also covers this.
      - run: pnpm exec tsc -b --noEmit
      - run: pnpm run verify:ai-skills

  build-and-verify:
    runs-on: ubuntu-latest
    needs: typecheck-and-ai-skills
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run build
      - run: pnpm run verify:ai-skills
      - run: npx tsx scripts/verify-all.ts

  ai-skills-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run verify:ai-skills
