          - heading "A Michelin-Trained Chef in Your Villa" [level=2] [ref=e1536]
          - paragraph [ref=e1538]: When you hire a private chef in Bali, you are not ordering dinner. You are commissioning an evening. Our executive chef Adriano — trained in Modena and Tokyo — leads a team of four Indonesian chefs he has personally trained for 6 to 12 months each. They arrive at your villa three hours before service, transform your kitchen into a fine dining station, and serve a multi-course tasting menu at your table.
          - paragraph [ref=e1539]: Every ingredient is sourced that morning. The pasta is rolled in your kitchen. The Wagyu is flame-grilled in front of your guests. The wine is paired course by course. And when the evening ends, the team leaves your villa spotless — as if they were never there.
          - paragraph [ref=e1540]: "This is not a catering service. This is a private restaurant built inside your villa for one night only. Available across Bali: Seminyak, Canggu, Uluwatu, Ubud, Sanur, and Nusa Dua."
        - img "Private chef preparing a fine dining course in a Bali villa kitchen" [ref=e1542]
      - generic [ref=e1544]:
        - generic [ref=e1545]:
          - paragraph [ref=e1546]: Built For
          - heading "Who Villa Fine Dining Is For" [level=2] [ref=e1547]
          - paragraph [ref=e1548]: If you want more than a restaurant reservation — a private evening designed around you — this is it.
        - generic [ref=e1549]:
