            - button "How far in advance do we need to book?" [expanded] [ref=e2992] [cursor=pointer]:
              - generic [ref=e2993]: How far in advance do we need to book?
              - img [ref=e2994]
            - region "How far in advance do we need to book?" [ref=e2996]:
              - paragraph [ref=e2997]: "Weddings and large retreats: 3–6 months for high season (July–August, December–January). Smaller events and corporate: 4–6 weeks is comfortable. Last-minute is possible — we have run a 30-guest dinner with 72 hours notice. WhatsApp Sofia and we will tell you what is still open."
          - generic [ref=e2998]:
            - button "Is the price per person all-in or does tax come on top?" [expanded] [ref=e2999] [cursor=pointer]:
              - generic [ref=e3000]: Is the price per person all-in or does tax come on top?
              - img [ref=e3001]
            - region "Is the price per person all-in or does tax come on top?" [ref=e3003]:
              - paragraph [ref=e3004]: Listed prices are ++ (before 10% government service charge and 11% VAT). We always show the all-in number in the proposal so you know the total — no surprises. Groceries are billed at cost with no markup.
          - generic [ref=e3005]:
            - button "Do you handle dietary requirements at scale?" [expanded] [ref=e3006] [cursor=pointer]:
              - generic [ref=e3007]: Do you handle dietary requirements at scale?
              - img [ref=e3008]
            - region "Do you handle dietary requirements at scale?" [ref=e3010]:
              - paragraph [ref=e3011]: Yes — this is one of the things we do best. Vegan, halal, gluten-free, raw, kosher-style, nut allergy, shellfish allergy, kids portions. We label every dish, run separate prep lines for allergies, and have done full halal weddings and dietary-led retreats for hundreds.
          - generic [ref=e3012]:
            - button "Can you work at any villa in Bali?" [expanded] [ref=e3013] [cursor=pointer]:
              - generic [ref=e3014]: Can you work at any villa in Bali?
              - img [ref=e3015]
            - region "Can you work at any villa in Bali?" [ref=e3017]:
              - paragraph [ref=e3018]: Yes. We are mobile hospitality — full kitchen, glassware, linens, generator, cold chain, the lot. We have worked across villas in Seminyak, Canggu, Ubud, Uluwatu, Sanur, Nusa Dua, Jimbaran, Pererenan, Berawa, and the Bukit peninsula. If your villa is in Bali, we can run an event there.
          - generic [ref=e3019]:
            - button "Do we pay a deposit, and what happens if we cancel?" [ref=e3020] [cursor=pointer]:
              - generic [ref=e3021]: Do we pay a deposit, and what happens if we cancel?
              - img [ref=e3022]
            - region "Do we pay a deposit, and what happens if we cancel?":
              - paragraph [ref=e3024]: 50% deposit to confirm the date, balance due the week of the event. Cancellation policy is in your proposal — full refund up to 30 days out, 50% inside 30 days, no refund inside 14 days. Force-majeure clauses are standard.
          - generic [ref=e3025]:
            - button "Who is our point of contact?" [ref=e3026] [cursor=pointer]:
              - generic [ref=e3027]: Who is our point of contact?
              - img [ref=e3028]
            - region "Who is our point of contact?":
              - paragraph [ref=e3030]: Sofia handles events end-to-end — the same person from first WhatsApp to the day-of coordination on site. No handoffs, no losing context. For corporate accounts she works alongside Olivia for invoicing and NPWP paperwork.
          - generic [ref=e3031]:
            - button "Can we customise the menu?" [ref=e3032] [cursor=pointer]:
              - generic [ref=e3033]: Can we customise the menu?
              - img [ref=e3034]
            - region "Can we customise the menu?":
              - paragraph [ref=e3036]: Every menu is built around the brief. Cuisine, courses, signature dishes, kids menu, dietary-specific lines, branded courses for corporate. Send the spec and we tailor it — and you taste the menu before you sign off when there is time.
          - generic [ref=e3037]:
            - button "Do you provide staff, bartenders, and coordinators?" [ref=e3038] [cursor=pointer]:
