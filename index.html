<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />
    <meta name="robots" content="index,follow,max-image-preview:large" />

    <title>myCHEF.id - Private Chef & Event Experiences in Bali</title>
    <meta name="description" content="Private chefs, villa catering, and full-service events in Bali. Italian fine dining and Michelin-trained leadership across Seminyak, Canggu, Ubud, Uluwatu, and Sanur." />
    <link rel="canonical" href="https://mychef.id/" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="myCHEF.id" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="myCHEF.id - Private Chef & Event Experiences in Bali" />
    <meta property="og:description" content="Italian fine dining, private villa chefs, and full-service events in Bali. A Michelin-trained team of 50+ in your kitchen." />
    <meta property="og:url" content="https://mychef.id/" />
    <meta property="og:image" content="https://mychef.id/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="myCHEF.id - Private chef plating a fine dining course in a Bali villa" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="myCHEF.id - Private Chef & Event Experiences in Bali" />
    <meta name="twitter:description" content="Italian fine dining, private villa chefs, and full-service events in Bali." />
    <meta name="twitter:image" content="https://mychef.id/og-image.jpg" />

    <!-- Performance: preconnect to WhatsApp and preload hero -->
    <link rel="preconnect" href="https://wa.me" />
    <link rel="preload" as="image" href="/generated/hub-hero-v3.jpg" fetchpriority="high" />

    <!-- Structured data: LocalBusiness -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "@id": "https://mychef.id/#business",
        "name": "myCHEF Indonesia",
        "alternateName": "myCHEF.id",
        "description": "Private chefs, villa catering, and full-service events across Bali. Italian fine dining and Michelin-trained leadership.",
        "url": "https://mychef.id/",
        "telephone": "+62-822-3756-5997",
        "email": "indonesia@mychef.id",
        "image": "https://mychef.id/og-image.jpg",
        "priceRange": "IDR 600.000 - IDR 75.000.000",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Jl. Tukad Barito Timur III No.16, Panjer",
          "addressLocality": "Denpasar Selatan",
          "addressRegion": "Bali",
          "postalCode": "80226",
          "addressCountry": "ID"
        },
        "areaServed": [
          { "@type": "Place", "name": "Seminyak" },
          { "@type": "Place", "name": "Canggu" },
          { "@type": "Place", "name": "Ubud" },
          { "@type": "Place", "name": "Uluwatu" },
          { "@type": "Place", "name": "Sanur" },
          { "@type": "Place", "name": "Nusa Dua" }
        ],
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"],
          "opens": "08:00",
          "closes": "22:00"
        },
        "sameAs": []
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
