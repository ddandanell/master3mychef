<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" fill="#050505"/>

  <!-- Gold frame -->
  <rect x="8" y="8" width="48" height="48" fill="none" stroke="#C5A028" stroke-width="2"/>

  <!-- M letter - stylized for myCHEF -->
  <text x="32" y="42" font-family="Playfair Display, serif" font-size="36" font-weight="300" fill="#C5A028" text-anchor="middle" letter-spacing="2">M</text>

  <!-- Decorative elements -->
  <circle cx="12" cy="12" r="2" fill="#C5A028"/>
  <circle cx="52" cy="12" r="2" fill="#C5A028"/>
  <circle cx="12" cy="52" r="2" fill="#C5A028"/>
  <circle cx="52" cy="52" r="2" fill="#C5A028"/>
</svg>
